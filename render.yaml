# Render 部署蓝图：在 Render 中选择仓库后自动套用以下配置
services:
  - type: web
    name: english-writing-tutor
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # 前端产物（frontend/dist）已提交到仓库，云端只装后端依赖并直接托管静态文件，
    # 避免在云端安装/构建 vite+rollup（渲染环境与本地平台不同，原生模块易失败）。
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DEEPSEEK_API_KEY
        sync: false # 部署时手动填入，不写入仓库
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
